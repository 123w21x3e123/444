name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -o 444.exe .
      - uses: softprops/action-gh-release@v2
        with:
          files: 444.exe
