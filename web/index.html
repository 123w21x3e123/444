<!doctype html><meta charset="utf-8"><title>444</title>
<style>
:root{--accent:#1db954;--outer:#000;--panel:#121212;--hover:#2a2a2a;--text:#fff;--muted:#b3b3b3}
:root.light{--outer:#e4e4e4;--panel:#fff;--hover:#ececec;--text:#111;--muted:#666}
*{box-sizing:border-box;margin:0}
body{background:var(--outer);color:var(--text);font:14px system-ui,sans-serif;height:100vh;display:grid;grid-template:1fr 84px/220px 1fr;gap:8px;padding:8px;overflow:hidden}
aside,main,footer{background:var(--panel);border-radius:8px}
aside{padding:20px 12px}aside h1{font-size:22px;padding:0 12px 16px;color:var(--accent)}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--muted);font:600 15px system-ui;padding:10px 12px;border-radius:6px;cursor:pointer}
nav button.on,nav button:hover{color:var(--text)}
main{overflow:auto;padding:16px 20px}
#top{display:flex;gap:12px;align-items:center;position:sticky;top:-16px;background:var(--panel);padding:8px 0;z-index:1}
#q{flex:1;max-width:340px;padding:9px 14px;border-radius:20px;border:0;background:var(--hover);color:var(--text);outline:0}
h2{font-size:18px}
.row{display:grid;grid-template-columns:44px 1fr 1fr;gap:12px;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer}
.row:hover{background:var(--hover)}.row.cur .t{color:var(--accent)}
.row img,.cv{width:40px;height:40px;border-radius:4px;background:var(--hover);object-fit:cover}
.t{font-weight:600}.m,.al{color:var(--muted)}
.row div{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.card{background:var(--hover);padding:14px;border-radius:8px;cursor:pointer}
.card b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:8px}.card span{color:var(--muted);font-size:12px}
footer{grid-column:1/3;display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;padding:0 16px;gap:16px}
#np{display:flex;gap:12px;align-items:center;overflow:hidden}#np .cv{width:56px;height:56px;flex:none}
#ctl{text-align:center}
#ctl button{background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer;padding:4px 8px}
#ctl button.on{color:var(--accent)}#ctl #pp{color:var(--text);font-size:26px}
#seek{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:11px}
input[type=range]{accent-color:var(--accent);flex:1}#vol{justify-self:end;width:110px;flex:none}
</style>
<aside><h1>444</h1><nav><button data-v="songs" class="on">Songs</button><button data-v="artists">Artists</button><button data-v="albums">Albums</button></nav></aside>
<main><div id="top"><input id="q" placeholder="Search"><h2 id="h"></h2></div><div id="list"></div></main>
<footer>
<div id="np"><img id="cover" class="cv" style="visibility:hidden"><div><div class="t" id="nt">Nothing playing</div><div class="m" id="na"></div></div></div>
<div id="ctl"><button id="sh">⇄</button><button id="pv">⏮</button><button id="pp">▶</button><button id="nx">⏭</button><button id="rp">⟳</button>
<div id="seek"><span id="cu">0:00</span><input type="range" id="sk" min="0" max="1000" value="0"><span id="du">0:00</span></div></div>
<input type="range" id="vol" min="0" max="1" step="0.01" value="0.8">
</footer>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const a=new Audio();a.volume=.8;
let all=[],view='songs',scope=null,shown=[],queue=[],i=-1,shuf=false,rep=false;
const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
const hide=`onerror="this.style.visibility='hidden'"`;
function render(){
 const q=$('#q').value.toLowerCase(),L=$('#list');
 $('#h').innerHTML=scope?esc(scope.v)+' <a href="#" id="x" style="color:var(--muted)">×</a>':'';
 if(view==='songs'){
  shown=all.filter(t=>(!scope||t[scope.k]===scope.v)&&(t.title+' '+t.artist+' '+t.album).toLowerCase().includes(q));
  L.className='';
  L.innerHTML=shown.map((t,n)=>`<div class="row${queue[i]&&queue[i].id===t.id?' cur':''}" data-n="${n}"><img loading="lazy" src="/api/cover/${t.id}" ${hide}><div><div class="t">${esc(t.title)}</div><div class="m">${esc(t.artist)}</div></div><div class="al">${esc(t.album)}</div></div>`).join('');
 }else{
  const k=view==='artists'?'artist':'album',g={};
  all.forEach(t=>(g[t[k]]=g[t[k]]||[]).push(t));
  L.className='grid';
  L.innerHTML=Object.keys(g).filter(n=>n.toLowerCase().includes(q)).sort().map(n=>`<div class="card" data-k="${k}" data-v="${esc(n)}"><img class="cv" style="width:100%;height:auto;aspect-ratio:1" loading="lazy" src="/api/cover/${g[n][0].id}" ${hide}><b>${esc(n)}</b><span>${g[n].length} songs</span></div>`).join('');
 }
}
function nav(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view))}
function play(n){
 if(!queue.length)return;
 i=(n+queue.length)%queue.length;const t=queue[i];
 a.src='/api/stream/'+t.id;a.play();
 $('#nt').textContent=t.title;$('#na').textContent=t.artist+' · '+t.album;
 const c=$('#cover');c.style.visibility='visible';c.src='/api/cover/'+t.id;c.onerror=()=>c.style.visibility='hidden';
 document.title=t.title+' · 444';
 document.querySelectorAll('.row').forEach(r=>r.classList.toggle('cur',shown[+r.dataset.n]&&shown[+r.dataset.n].id===t.id));
 if('mediaSession' in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist,album:t.album,artwork:[{src:'/api/cover/'+t.id}]});
}
const next=()=>{if(shuf)play(Math.floor(Math.random()*queue.length));else if(i+1<queue.length||rep)play(i+1)};
const prev=()=>a.currentTime>3?a.currentTime=0:play(i-1);
const pp=()=>a.src&&(a.paused?a.play():a.pause());
$('#list').onclick=e=>{
 const r=e.target.closest('.row'),c=e.target.closest('.card');
 if(r){queue=shown.slice();play(+r.dataset.n)}
 if(c){scope={k:c.dataset.k,v:c.dataset.v};view='songs';nav();render()}
};
$('#h').onclick=e=>{if(e.target.id==='x'){e.preventDefault();scope=null;render()}};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;scope=null;nav();render()});
$('#q').oninput=render;
$('#nx').onclick=next;$('#pv').onclick=prev;$('#pp').onclick=pp;
$('#sh').onclick=e=>e.currentTarget.classList.toggle('on',shuf=!shuf);
$('#rp').onclick=e=>e.currentTarget.classList.toggle('on',rep=!rep);
$('#vol').oninput=e=>a.volume=e.target.value;
$('#sk').oninput=e=>a.currentTime=e.target.value/1000*a.duration;
a.onended=next;
a.onplay=a.onpause=()=>$('#pp').textContent=a.paused?'▶':'⏸';
a.ontimeupdate=()=>{if(a.duration)$('#sk').value=a.currentTime/a.duration*1000;$('#cu').textContent=fmt(a.currentTime);$('#du').textContent=fmt(a.duration)};
addEventListener('keydown',e=>{
 if(e.target.tagName==='INPUT'&&e.target.type!=='range')return;
 if(e.code==='Space'){e.preventDefault();pp()}
 else if(e.ctrlKey&&e.code==='ArrowRight')next();
 else if(e.ctrlKey&&e.code==='ArrowLeft')prev();
});
if('mediaSession' in navigator){const m=navigator.mediaSession;m.setActionHandler('nexttrack',next);m.setActionHandler('previoustrack',prev);m.setActionHandler('play',pp);m.setActionHandler('pause',pp)}
(async()=>{
 const c=await(await fetch('/api/config')).json();
 document.documentElement.style.setProperty('--accent',c.accent);
 if(c.theme==='light')document.documentElement.classList.add('light');
 all=await(await fetch('/api/tracks')).json();render();
})();
</script>
